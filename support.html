<h1>支持</h1>
<p>遇到问题或有建议，请在 <a href="https://github.com/keithxc/nib-site/issues/new">GitHub Issues</a> 提交。Issues 是公开的并需要 GitHub 账号，请不要附上真实账单、付款截图或其他个人信息。</p>
<h2>常见问题</h2>
<ul><li><strong>账本在哪里？</strong> 在“设置 → 数据位置”查看；账本是每年一个 Markdown 文件，可在“文件”App 中打开。</li><li><strong>如何导出？</strong> 在“设置 → 导出与备份”中导出。</li><li><strong>如何删除数据？</strong> 见<a href="privacy.html">隐私政策</a>中的“数据的导出与删除”。</li></ul>
